[package]
name = "omnicreator-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "omnicreator"
path = "src/main.rs"

[dependencies]
omnicreator-application = { path = "../omnicreator-application" }
omnicreator-core = { path = "../omnicreator-core" }
rmcp = { version = "3.3.0", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }

[dev-dependencies]
rmcp = { version = "3.3.0", default-features = false, features = ["client", "transport-child-process"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread"] }
