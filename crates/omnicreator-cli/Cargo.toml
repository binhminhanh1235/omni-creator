[package]
name = "omnicreator-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "omnicreator"
path = "src/main.rs"

[dependencies]
omnicreator-application = { path = "../omnicreator-application" }
omnicreator-core = { path = "../omnicreator-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
