name: Phase 18 P2 rustfmt

on:
  push:
    branches:
      - feat/phase18-p2-mcp-stdio

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase18-p2-mcp-stdio
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/omnicreator-cli/src/mcp.rs crates/omnicreator-cli/src/main.rs crates/omnicreator-cli/tests/mcp.rs
          git commit -m "style: apply rustfmt to Phase 18 P2"
          git push origin HEAD:feat/phase18-p2-mcp-stdio
