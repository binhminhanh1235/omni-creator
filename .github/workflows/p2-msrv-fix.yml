name: Phase 18 P2 MSRV fix

on:
  push:
    branches:
      - feat/phase18-p2-mcp-stdio

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase18-p2-mcp-stdio
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply semantics-preserving fixes
        run: |
          sed -i 's/\.map_or(true,/.is_none_or(/g' crates/omnicreator-core/src/creator_run_coordinator.rs crates/omnicreator-core/src/creator_step_execution.rs crates/omnicreator-core/src/creator_visual_orchestration.rs crates/omnicreator-core/src/generated_image.rs crates/omnicreator-core/src/plugin_lifecycle.rs crates/omnicreator-core/src/review_center_recovery.rs
          sed -i 's/milliseconds % 1000 == 0/milliseconds.is_multiple_of(1000)/' crates/omnicreator-core/src/fcpxml.rs
          python -c 'from pathlib import Path; p=Path("crates/omnicreator-cli/tests/mcp.rs"); t=p.read_text(); old="        .find(|item| {\n            item[\"step_id\"]\n                .as_str()\n                .is_some_and(|value| value.contains(\"content\"))\n        })"; new="        .find(|item| item[\"step\"] == \"content.prepare\")"; assert old in t; t=t.replace(old,new); old2="serde_json::from_value(structured(&editor)[2].clone()).unwrap();"; new2="serde_json::from_value(structured(&editor)[\"data\"][2].clone()).unwrap();"; assert old2 in t; p.write_text(t.replace(old2,new2))'
          cargo fmt --all
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/omnicreator-core/src crates/omnicreator-cli/tests/mcp.rs
          git commit -m "fix: align Phase 18 P2 with Rust 1.88 MSRV"
          git push origin HEAD:feat/phase18-p2-mcp-stdio
