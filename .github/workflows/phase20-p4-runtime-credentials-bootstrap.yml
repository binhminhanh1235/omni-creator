name: Phase 20 P4 runtime credentials bootstrap

on:
  push:
    branches:
      - feat/phase20-p4-runtime-plugin-credentials

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply runtime credential implementation
        run: |
          python3 .github/phase20_p4_patch.py
          git checkout -- .github/workflows/ci.yml
      - name: Format Rust
        run: cargo fmt --all
      - name: JavaScript syntax and runtime credential smoke
        run: |
          node --check apps/desktop/dist/app.js
          node apps/desktop/tests/plugin-runtime-credentials-smoke.mjs
      - name: Core targeted tests
        run: cargo test -p omnicreator-core plugin_process
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git add crates/omnicreator-core/src/plugin_process.rs \
                  apps/desktop/src-tauri/src/application.rs \
                  apps/desktop/dist/app.js \
                  apps/desktop/dist/styles.css \
                  apps/desktop/tests/plugin-runtime-credentials-smoke.mjs
          git commit -m "feat: add runtime plugin API keys"
          git push
