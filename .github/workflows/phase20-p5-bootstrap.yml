name: Phase 20 P5 credential persistence bootstrap

on:
  push:
    branches:
      - fix/phase20-p5-persist-plugin-credentials

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply persisted credential patch
        run: python3 .github/phase20_p5_patch.py
      - name: JavaScript syntax
        run: node --check apps/desktop/dist/app.js
      - name: Runtime credential regression
        run: node apps/desktop/tests/plugin-runtime-credentials-smoke.mjs
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format Desktop Rust
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Desktop clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Desktop tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/desktop/src-tauri/src/main.rs \
            apps/desktop/src-tauri/src/application.rs \
            apps/desktop/src-tauri/src/plugin_credentials.rs \
            apps/desktop/dist/app.js \
            apps/desktop/tests/plugin-runtime-credentials-smoke.mjs \
            docs/25-unified-settings.md \
            docs/25-unified-settings.vi.md
          git commit -m "fix: persist plugin API keys and refresh readiness"
          git push
