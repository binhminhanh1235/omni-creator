name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  p3_http_mock_patch:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/phase18-p3-llm-provider-openrouter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch deterministic HTTP mock
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/p3-http-mock.py
          python3 /tmp/p3-http-mock.py
          cargo fmt --all
          cargo test -p omnicreator-core --lib llm_provider::tests::openai_compatible_chat_uses_standard_endpoint_and_omits_llmgateway_fields
      - name: Commit deterministic mock
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/omnicreator-core/src/llm_provider.rs
          git commit -m "test(llm): read complete HTTP mock request"
          git push origin HEAD:${GITHUB_HEAD_REF}

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile plugins/pexels/plugin.py plugins/pexels/tests/test_plugin.py plugins/pixabay/plugin.py plugins/pixabay/tests/test_plugin.py plugins/unsplash/plugin.py plugins/unsplash/tests/test_plugin.py plugins/storyblocks/plugin.py plugins/storyblocks/tests/test_plugin.py plugins/generated-image-reference/plugin.py plugins/generated-image-reference/tests/test_plugin.py plugins/generated-image-api/plugin.py plugins/generated-image-api/image_api_support.py plugins/generated-image-api/tests/test_plugin.py
      - name: Pexels offline tests
        run: python3 -m unittest discover -s plugins/pexels/tests -p 'test_*.py'
      - name: Pixabay offline tests
        run: python3 -m unittest discover -s plugins/pixabay/tests -p 'test_*.py'
      - name: Unsplash offline tests
        run: python3 -m unittest discover -s plugins/unsplash/tests -p 'test_*.py'
      - name: Storyblocks offline tests
        run: python3 -m unittest discover -s plugins/storyblocks/tests -p 'test_*.py'
      - name: Generated image offline tests
        run: python3 -m unittest discover -s plugins/generated-image-reference/tests -p 'test_*.py'
      - name: Generated image API offline tests
        run: python3 -m unittest discover -s plugins/generated-image-api/tests -p 'test_*.py'
      - name: Stick figure offline tests
        run: python3 -m unittest discover -s plugins/stick-figure-reference/tests -p 'test_*.py'

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             build-essential             curl             wget             file             libxdo-dev             libssl-dev             libayatana-appindicator3-dev             librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Desktop format
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - name: Desktop JavaScript syntax
        run: |
          node --check apps/desktop/dist/app.js
          node --check apps/desktop/dist/review-center-p6.js
          node --check apps/desktop/dist/workflow-step-controls.js
      - name: Desktop GPU Workbench regression
        run: node apps/desktop/tests/gpu-workbench-smoke.mjs
      - name: Desktop Production Pack regression
        run: node apps/desktop/tests/production-pack-smoke.mjs
      - name: Desktop Production Recovery regression
        run: node apps/desktop/tests/production-pack-recovery-smoke.mjs
      - name: Desktop Studio Pack P2 regression
        run: node apps/desktop/tests/studio-pack-p2-smoke.mjs
      - name: Desktop Studio Pack P3 regression
        run: node apps/desktop/tests/studio-pack-p3-smoke.mjs
      - name: Desktop Asset Library regression
        run: node apps/desktop/tests/asset-library-smoke.mjs
      - name: Desktop Plugin Manager P1 regression
        run: node apps/desktop/tests/plugin-manager-p1-smoke.mjs
      - name: Desktop Plugin Manager P2 regression
        run: node apps/desktop/tests/plugin-manager-p2-smoke.mjs
      - name: Desktop Plugin Manager P3 regression
        run: node apps/desktop/tests/plugin-manager-p3-smoke.mjs
      - name: Desktop Manual Visual regression
        run: node apps/desktop/tests/manual-visual-smoke.mjs
      - name: Desktop Manual Voice regression
        run: node apps/desktop/tests/manual-voice-smoke.mjs
      - name: Desktop External Handoff regression
        run: node apps/desktop/tests/external-handoff-smoke.mjs
      - name: Desktop Review Center P6 regression
        run: node apps/desktop/tests/review-center-p6-smoke.mjs
      - name: Desktop Workflow Step Controls regression
        run: node apps/desktop/tests/workflow-step-controls-smoke.mjs
      - name: Desktop LLM Provider P3 regression
        run: node apps/desktop/tests/llm-provider-p3-smoke.mjs
      - name: Desktop clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Desktop tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Desktop smoke check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
