name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile plugins/pexels/plugin.py plugins/pexels/tests/test_plugin.py plugins/generated-image-reference/plugin.py plugins/generated-image-reference/tests/test_plugin.py
      - name: Pexels offline tests
        run: python3 -m unittest discover -s plugins/pexels/tests -p 'test_*.py'
      - name: Generated image offline tests
        run: python3 -m unittest discover -s plugins/generated-image-reference/tests -p 'test_*.py'

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             build-essential             curl             wget             file             libxdo-dev             libssl-dev             libayatana-appindicator3-dev             librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Desktop format
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - name: Desktop JavaScript syntax
        run: node --check apps/desktop/dist/app.js
      - name: Desktop GPU Workbench regression
        run: node apps/desktop/tests/gpu-workbench-smoke.mjs
      - name: Desktop clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Desktop tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Desktop smoke check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
