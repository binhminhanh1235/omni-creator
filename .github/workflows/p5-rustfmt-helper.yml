name: P5 rustfmt helper

on:
  push:
    branches:
      - feat/phase16-p5-production-pack-recovery

permissions:
  contents: write

jobs:
  format-desktop:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase16-p5-production-pack-recovery
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply repository rustfmt
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src-tauri/src/main.rs
          git commit -m 'style(desktop): apply rustfmt to P5 recovery imports'
          git push origin HEAD:feat/phase16-p5-production-pack-recovery
